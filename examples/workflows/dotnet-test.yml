# dotnet-test.yml — Build and test a .NET 10 C# project on the PerformanceNode runner.
#
# Prerequisites:
#   1. The Pi 5 runner must be fully configured with the PerformanceNode setup scripts
#      (run ./setup.sh from the repo root on the Pi).
#   2. The NuGet package cache must be initialised on the host:
#         sudo scripts/cache/setup-nuget-cache.sh
#      This creates /opt/runner-cache/nuget and registers it via the cache-hook-wrapper so it
#      is automatically bind-mounted into every job container — no actions/cache needed.
#   3. The runner must be registered with the labels:
#         self-hosted, linux, arm64, performancenode
#
# How caching works on this runner:
#   The inject-cache-mounts.sh hook wrapper intercepts the runner's prepare_job hook
#   and injects bind mounts for /opt/runner-cache/nuget → /root/.nuget/packages (and others).
#   NuGet sees the cached packages in the standard location without any workflow-level
#   volume declarations — the host path persists across container runs automatically.
#
# Copy this file to .github/workflows/ in your own repository.

name: .NET 10 — Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab for ad-hoc testing.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (.NET 10 / ARM64)
    # Target the PerformanceNode Pi 5 runner. All four labels must match the
    # runner registration; adjust if you registered with different labels.
    runs-on: [self-hosted, linux, arm64, performancenode]

    # Run inside the official .NET 10 SDK container via ACTIONS_RUNNER_CONTAINER_HOOKS.
    # The runner's cache-hook-wrapper automatically mounts the host NuGet cache into
    # this container at /root/.nuget/packages before the job starts.
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    env:
      # Point NuGet at the host-mounted cache directory.
      # This path is bind-mounted automatically by inject-cache-mounts.sh;
      # it resolves to the host's /opt/runner-cache/nuget (configured by setup-nuget-cache.sh).
      # Setting it explicitly here is defensive: it ensures dotnet restore uses
      # the mounted cache even if the workflow env overrides the hook-injected value.
      NUGET_PACKAGES: /root/.nuget/packages
      # Opt out of Microsoft telemetry in CI.
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NuGet cache note:
      # No actions/cache step is required. The PerformanceNode runner injects the
      # host NuGet cache at /root/.nuget/packages via the cache-hook-wrapper before
      # this step runs. On a warm cache the restore below completes from disk only
      # (no network traffic). See docs/caching-strategy.md for details.

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger trx \
            --results-directory "${{ runner.temp }}/test-results"

      # Upload test results even when tests fail so failures can be reviewed.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 14
